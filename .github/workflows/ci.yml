name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc file
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Prepare
        run: npm ci

      - name: Run lint
        run: npm run lint
  build-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc file
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Prepare
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build showcase
        run: npm run build:showcase

      - name: Build docs
        run: npm run docs

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test -- ngx-maplibre-gl --watch=false

      - name: Run e2e tests
        run: npm run e2e

      # `test-results` holds the traces, videos and screenshots for failed
      # attempts; the HTML report on its own only links to them.
      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
